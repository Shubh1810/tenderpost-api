version: '3.8'

services:
  tenderpost-scraper-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenderpost-scraper-dev
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=pretty
      - ENVIRONMENT=development
    volumes:
      - ./logs:/app/logs
    restart: "no"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    tty: true
    stdin_open: true
    develop:
      watch:
        - action: sync
          path: ./main.py
          target: /app/main.py
        - action: sync
          path: ./scraper.py
          target: /app/scraper.py
        - action: sync
          path: ./run_cron.py
          target: /app/run_cron.py
        - action: sync
          path: ./supabase_client.py
          target: /app/supabase_client.py
        - action: sync
          path: ./logger.py
          target: /app/logger.py
        - action: rebuild
          path: pyproject.toml

  cppp-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenderpost-cppp-scraper
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=pretty
      - ENVIRONMENT=development
    volumes:
      - ./logs:/app/logs
    restart: "no"
    command: ["python", "run_cron.py"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    develop:
      watch:
        - action: sync
          path: ./scraper.py
          target: /app/scraper.py
        - action: sync
          path: ./run_cron.py
          target: /app/run_cron.py
        - action: sync
          path: ./logger.py
          target: /app/logger.py
        - action: sync
          path: ./supabase_client.py
          target: /app/supabase_client.py
        - action: rebuild
          path: pyproject.toml
