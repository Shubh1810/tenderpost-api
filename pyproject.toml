[tool.poetry]
name = "tenderpost-backend"
version = "2.0.0"
description = "CPPP tender scraper — httpx + selectolax, no browser required"
authors = ["TenderPost Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
httpx = {extras = ["asyncio"], version = "^0.27.2"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
selectolax = "^0.3.17"
lxml = "^5.0.0"
python-dotenv = "^1.0.0"
supabase = "2.24.0"
tenacity = "^8.2.0"
loguru = "^0.7.0"
tqdm = "^4.66.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
